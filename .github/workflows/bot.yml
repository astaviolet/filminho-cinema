name: bot-24-7

on:
  push:
    branches: [main]
    paths:
      - "bot.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/bot.yml"
  schedule:
    # reativa ~1h antes do limite de 6h do job — o bot nunca cai de madrugada
    - cron: "0 */5 * * *"
  workflow_dispatch:

concurrency:
  group: filminho-bot
  cancel-in-progress: true

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Rodar o bot (online 24/7)
        run: node bot.mjs
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
